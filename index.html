<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Claim Solana - Reclaim SOL</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
</head>
<body style="background:#080808;margin:0;display:flex;justify-content:center;padding:20px;font-family:Inter,Arial,sans-serif">
<div style="background:#121212;padding:28px;border-radius:24px;max-width:400px;width:100%;text-align:center;color:#fff;border:1px solid #222">
<h2 style="margin:0 0 10px">Get Claim Solana ♻️</h2>
<p style="color:#aaa;font-size:14px;margin:0">Close empty token accounts & reclaim your SOL</p>
<div style="background:#1e1e1e;border-radius:12px;padding:14px;text-align:left;font-size:13px;margin:20px 0;color:#ccc;line-height:1.6">
✅ Non-custodial - we never touch your funds<br>
✅ Only closes empty accounts<br>
✅ Full preview in Phantom<br>
✅ Verifiable on-chain - 5% fee transparent
</div>
<button id="connectBtn" style="background:#A855F7;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;font-size:15px;cursor:pointer">Connect Phantom</button>
<div id="info" style="margin:18px 0 0;color:#aaa;font-size:13px;min-height:20px">Not connected</div>
<button id="claimBtn" style="display:none;background:#A855F7;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;margin-top:12px">Claim</button>
<button id="retryBtn" style="display:none;background:#333;color:#fff;border:0;padding:16px;border-radius:14px;width:100%;font-weight:bold;margin-top:12px">Retry</button>
</div>
<script>
const FEE_WALLET = "HptgriUnvav3AitnWf5DWinZ7gncB5GMwMgaTFuUPNdr";
const RPCS = ["/api/rpc", "https://solana-rpc.publicnode.com", "https://api.mainnet-beta.solana.com"];
const BATCH_SIZE = 20;
const RENT_PER_ACCOUNT = 2039280;
let pubkey, provider, emptyList=[];
async function connectWallet(){
 let info=document.getElementById('info');
 let btn=document.getElementById('connectBtn');
 let claim=document.getElementById('claimBtn');
 let retry=document.getElementById('retryBtn');
 try{
  if(!window.solana) return alert("Please open in Phantom App Browser");
  btn.innerText="Connecting...";
  let r=await window.solana.connect();
  pubkey=r.publicKey; provider=window.solana;
  btn.innerText=pubkey.toBase58().slice(0,4)+"..."+pubkey.toBase58().slice(-4);
  info.innerText="Scanning empty accounts...";
  retry.style.display="none";
  let parsed=null;
  for(let rpc of RPCS){
   try{
    let conn=new solanaWeb3.Connection(rpc,"confirmed");
    parsed=await conn.getParsedTokenAccountsByOwner(pubkey,{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
    if(parsed && parsed.value) break;
   }catch(e){}
  }
  if(!parsed) throw new Error("All RPCs busy, try again");
  emptyList=[];
  parsed.value.forEach(v=>{ if(v.account.data.parsed.info.tokenAmount.uiAmount===0) emptyList.push(v.pubkey); });
  if(emptyList.length==0){
    info.innerText="Wallet is clean, no empty accounts found";
    claim.style.display="none";
  }else{
    let est=(emptyList.length*0.00203928*0.95).toFixed(5);
    info.innerHTML=`Found <b>${emptyList.length} empty accounts</b><br>Est. reclaimable: <b>${est} SOL</b>`;
    claim.innerText=`Claim ${Math.min(emptyList.length,BATCH_SIZE)} Accounts (${emptyList.length} total)`;
    claim.style.display="block";
    claim.disabled=false;
  }
 }catch(e){
  info.innerText="Error: "+e.message;
  retry.style.display="block";
  btn.innerText="Connect Phantom";
 }
}
async function claimNow(){
 let btn=document.getElementById('claimBtn');
 btn.disabled=true; btn.innerText="Processing...";
 try{
  let conn=new solanaWeb3.Connection(RPCS[0],"confirmed");
  let batch=emptyList.slice(0,BATCH_SIZE);
  let tx=new solanaWeb3.Transaction();
  batch.forEach(pk=>{ tx.add(splToken.Token.createCloseAccountInstruction(splToken.TOKEN_PROGRAM_ID,pk,pubkey,pubkey,[])); });
  let fee=Math.floor(batch.length*RENT_PER_ACCOUNT*0.05);
  tx.add(solanaWeb3.SystemProgram.transfer({fromPubkey:pubkey,toPubkey:new solanaWeb3.PublicKey(FEE_WALLET),lamports:fee}));
  tx.feePayer=pubkey; tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
  let signed=await provider.signTransaction(tx);
  let sig=await conn.sendRawTransaction(signed.serialize());
  await conn.confirmTransaction(sig);
  emptyList = emptyList.slice(BATCH_SIZE);
  alert("Success! Tx: "+sig+"\nRemaining: "+emptyList.length);
  if(emptyList.length>0){ connectWallet(); } else { location.reload(); }
 }catch(e){ alert(e.message); btn.disabled=false; }
}
document.getElementById('connectBtn').onclick=connectWallet;
document.getElementById('retryBtn').onclick=connectWallet;
document.getElementById('claimBtn').onclick=claimNow;
</script>
</body>
</html>
